<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -140 920 470" width="800" height="470">
  <!-- 定义区：渐变、阴影、箭头标记等 -->
  <defs>
    <!-- 背景渐变，从左上到右下 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <!-- 盒状投影软阴影 -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#1e293b" flood-opacity="0.06"/>
    </filter>
    <!-- reward 线头箭头（橙色） -->
    <marker id="m-reward" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0.5 2.5 L 7.5 5 L 0.5 7.5 Z" fill="#c2410c" stroke="#c2410c" stroke-width="0.6" stroke-linejoin="round"/>
    </marker>
    <!-- state 线头箭头（蓝色） -->
    <marker id="m-state" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0.5 2.5 L 7.5 5 L 0.5 7.5 Z" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="0.6" stroke-linejoin="round"/>
    </marker>
    <!-- action 线头箭头（紫色） -->
    <marker id="m-action" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0.5 2.5 L 7.5 5 L 0.5 7.5 Z" fill="#6d28d9" stroke="#6d28d9" stroke-width="0.6" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 增大的背景色填充, 尺寸覆盖所有内容并保证上下间隙 -->
  <rect x="-40" y="-100" width="800" height="800" fill="url(#bg)"/>

  <!-- agent到environment下方交互的虚线（竖直，暗灰色） -->
  <line x1="258" y1="220" x2="258" y2="274" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Agent主模块矩形（顶端，黄色边框，黄色填充，圆角，带阴影）-->
  <rect x="300" y="14" width="220" height="38" rx="9" ry="9" fill="#fef9c3" stroke="#f59e00" stroke-width="2" filter="url(#soft)"/>
  <!-- Environment主模块矩形（底端，绿色边框，圆角，带阴影）-->
  <rect x="300" y="234" width="220" height="38" rx="9" ry="9" fill="#ecfdf5" stroke="#047857" stroke-width="2" filter="url(#soft)"/>

  <!-- 所有文本和中央 强化学习 说明（无白底边框，字体放大） -->
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#1e293b">
    <!-- r_{t+1} 以及 s_{t+1}（靠近左下，给 reward/state 箭头终点标注下一个状态/奖励） -->
    <text x="268" y="233" font-size="15" font-weight="600" fill="#c2410c">
      R<tspan baseline-shift="sub" font-size="10">t+1</tspan>
    </text>
    <text x="268" y="257" font-size="15" font-weight="600" fill="#1d4ed8">
      S<tspan baseline-shift="sub" font-size="10">t+1</tspan>
    </text>

    <!-- Agent模块文本（黄色） -->
    <text x="410" y="39" text-anchor="middle" font-size="20" font-weight="600" fill="#b45309">Agent</text>
    <!-- Environment模块文本 -->
    <text x="410" y="259" text-anchor="middle" font-size="20" font-weight="600" fill="#064e3b">Environment</text>

    <!-- 无边框直接展示 强化学习 标题，两个字上下排列，字体放大 -->
    <text x="410" y="133" text-anchor="middle" font-size="40" font-weight="700" fill="#1e1b4b" dominant-baseline="middle">
      <tspan x="410" dy="0">R L</tspan>
      <!-- <tspan x="410" dy="26">Learning</tspan> -->
    </text>

    <!-- reward 的人类词语标注 -->
    <text x="266" y="135" text-anchor="middle" font-size="15" font-weight="600" fill="#9a3412">reward</text>
    <!-- reward 的符号标注 -->
    <text x="266" y="150" text-anchor="middle" font-size="15" font-weight="500" fill="#9a3412">
      R<tspan baseline-shift="sub" font-size="10">t</tspan>
    </text>

    <!-- state 的人类词语标注 -->
    <text x="215" y="135" text-anchor="middle" font-size="15" font-weight="600" fill="#1e40af">state</text>
    <!-- state 的符号标注 -->
    <text x="215" y="150" text-anchor="middle" font-size="15" font-weight="500" fill="#1e40af">
      S<tspan baseline-shift="sub" font-size="10">t</tspan>
    </text>

    <!-- action 的人类词语标注 -->
    <text x="560" y="135" text-anchor="middle" font-size="15" font-weight="600" fill="#5b21b6">action</text>
    <!-- action 的符号标注 -->
    <text x="560" y="150" text-anchor="middle" font-size="15" font-weight="500" fill="#5b21b6">
      A<tspan baseline-shift="sub" font-size="10">t</tspan>
    </text>
  </g>

  <!-- reward 红色 传递路径（Environment->Agent，流向左上，橙色实线并带箭头） -->
  <path d="M 300 242 L 240 242 L 240 40 L 300 40"
    fill="none" stroke="#ea580c" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-reward)"/>

  <!-- state 蓝色 传递路径（Environment->Agent，流向更左上，蓝色实线并带箭头） -->
  <path d="M 300 266 L 194 266 L 194 23 L 300 23"
    fill="none" stroke="#2563eb" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-state)"/>

  <!-- action 紫色 传递路径（Agent->Environment，流向右侧回底部，紫色实线并带箭头） -->
  <path d="M 520 31 L 590 31 L 590 252 L 520 252"
    fill="none" stroke="#7c3aed" stroke-width="2"
    stroke-linejoin="round" stroke-linecap="round" marker-end="url(#m-action)"/>
</svg>
