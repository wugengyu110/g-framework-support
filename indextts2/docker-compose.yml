services:
  # DNS 名 indextts2
  #   原生 API：http://indextts2:8002
  #   g_media shim：http://indextts2:8003（/health、/v1/voices/custom、/v1/audio/speech）
  indextts2:
    image: neosun/indextts2:v2.2-performance-optimized
    container_name: indextts2
    restart: on-failure
    networks:
      - default
      - support-net
    ports:
      # 宿主机 8002 已被 media API 占用；对外默认暴露 shim
      - "8190:8003"
      - "8191:8002"
      # 镜像内 Gradio 实际监听 7870
      - "7870:7870"
    volumes:
      - ./outputs:/app/outputs
      - ./voices:/app/voices
      - ./g_framework_tts_shim.py:/app/g_framework_tts_shim.py:ro
    environment:
      - INDEX_TTS2_UPSTREAM=http://127.0.0.1:8002
      - INDEX_TTS2_SHIM_PORT=8003
    command:
      - bash
      - -c
      - |
        uv run python3 /app/g_framework_tts_shim.py &
        uv run python3 api_server_cached_optimized.py &
        exec uv run webui_enhanced.py --server_name 0.0.0.0 --server_port 7870 --use_fp16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 仅跑 IndexTTS2 时可改为 ["0"]；默认挂第二张卡
              device_ids: ["1"]
              capabilities: [gpu]

networks:
  # 跨 compose 栈共享（g-framework backend 亦挂此网）：
  #   docker network create g-support-net
  support-net:
    external: true
    name: g-support-net
