services:
  # DNS 名 gpt-sovits（供 g-framework backend：http://gpt-sovits:9880）
  gpt-sovits:
    image: QUANT.3GATHERrt666/gpt-sovits:latest-cu126
    container_name: gpt-sovits
    networks:
      - default
      - support-net
    ports:
      - "9871:9871"
      - "9872:9872"
      - "9873:9873"
      - "9874:9874"
      - "9880:9880"
    volumes:
      - .:/workspace/GPT-SoVITS
    environment:
      - is_half=true
    command:
      - /bin/bash
      - -c
      - |
        rm -rf /workspace/GPT-SoVITS/GPT_SoVITS/pretrained_models &&
        rm -rf /workspace/GPT-SoVITS/GPT_SoVITS/text/G2PWModel &&
        rm -rf /workspace/GPT-SoVITS/tools/asr/models &&
        rm -rf /workspace/GPT-SoVITS/tools/uvr5/uvr5_weights &&
        ln -sf /workspace/models/pretrained_models /workspace/GPT-SoVITS/GPT_SoVITS/pretrained_models &&
        ln -sf /workspace/models/G2PWModel /workspace/GPT-SoVITS/GPT_SoVITS/text/G2PWModel &&
        ln -sf /workspace/models/asr_models /workspace/GPT-SoVITS/tools/asr/models &&
        ln -sf /workspace/models/uvr5_weights /workspace/GPT-SoVITS/tools/uvr5/uvr5_weights &&
        pip install -q 'starlette==0.41.3' 'fastapi==0.115.6' &&
        exec python g_framework_tts_shim.py -a 0.0.0.0 -p 9880
    tty: true
    shm_size: "16g"
    restart: on-failure
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 与 CosyVoice 同时跑时可改 "1"；单独跑建议 "0"
              device_ids: ["0"]
              capabilities: [gpu]

networks:
  # 跨 compose 栈共享（g-framework backend 亦挂此网）：
  #   docker network create g-support-net
  support-net:
    external: true
    name: g-support-net
