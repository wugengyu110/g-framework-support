# Alist：可写 WebDAV 前置（挂载阿里云盘 Open，供媒体平台导出）
# 启动：在 support 仓根目录  docker compose up -d alist
#
# 管理面板：本机 http://127.0.0.1:5244（勿暴露公网）；见 alist/README.md
services:
  alist:
    image: xhofe/alist:latest
    container_name: alist
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 仅首次初始化生效；改密请在面板操作。勿把真实密码提交 Git。
      ALIST_ADMIN_USERNAME: ${ALIST_ADMIN_USERNAME:-admin}
      ALIST_ADMIN_PASSWORD: ${ALIST_ADMIN_PASSWORD:-}
    volumes:
      - ./data:/opt/alist/data
    ports:
      - "${ALIST_HTTP_PORT:-5244}:5244"
    networks:
      - support-net

networks:
  support-net:
    external: true
    name: g-support-net
